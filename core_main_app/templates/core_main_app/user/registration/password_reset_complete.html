{% load static %}
<div class="am-login-wrap am-login-page">
    <div class="am-login-card">
        <img src="{% static 'img/favicon.png' %}" alt="AsphaltMine" class="am-login-logo">
        <h2 class="am-login-title">{{ data.title }}</h2>
        <p class="am-login-subtitle">Your password has been set. You may go ahead and sign in now.</p>

        <div class="am-login-links">
            <a href="{% url 'core_main_app_login' %}">
                <i class="fas fa-sign-in-alt" aria-hidden="true"></i> Sign in
            </a>
        </div>
    </div>
</div>
